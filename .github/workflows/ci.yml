name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    # The oldest supported Ubuntu, so nothing newer sneaks in.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK 3 development files
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Shell scripts
        run: for f in install.sh uninstall.sh scripts/*.sh; do sh -n "$f"; done

      - name: GNOME Shell extension
        run: node --check extension/clipnest@erag.in/extension.js

      - name: Packages build
        run: |
          cargo build --release --locked
          scripts/build-deb.sh
          scripts/build-tarball.sh
